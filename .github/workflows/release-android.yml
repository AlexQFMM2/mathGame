name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${release_tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          android_version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' apps/mobile/android/app/build.gradle)"
          test "${package_version}" = "${RELEASE_VERSION}"
          for manifest in \
            apps/mobile/package.json \
            apps/web/package.json \
            packages/game-core/package.json \
            packages/sudoku-core/package.json \
            packages/crossmath-core/package.json \
            packages/grid-architect-core/package.json
          do
            manifest_version="$(node -p "require('./${manifest}').version")"
            test "${manifest_version}" = "${RELEASE_VERSION}"
          done
          test "${android_version}" = "${RELEASE_VERSION}"
          test -f "docs/release-notes-v${RELEASE_VERSION}.md"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: |
          pnpm typecheck
          pnpm test

      - name: Build installable APK
        run: pnpm mobile:android:github-release

      - name: Stage release files
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "release/MathGame-Android-debug-v${RELEASE_VERSION}.apk"
          sha256sum "release/MathGame-Android-debug-v${RELEASE_VERSION}.apk" > "release/MathGame-Android-debug-v${RELEASE_VERSION}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathGame-Android-debug-v${{ steps.release.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MathGame Android v${{ steps.release.outputs.version }}
          body_path: docs/release-notes-v${{ steps.release.outputs.version }}.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release/MathGame-Android-debug-v${{ steps.release.outputs.version }}.apk
            release/MathGame-Android-debug-v${{ steps.release.outputs.version }}.apk.sha256
